<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM 客户关系管理系统</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css?v=5">
  <link rel="stylesheet" href="css/components.css?v=15">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航栏 - 深蓝色 -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-sidebar-toggle" id="btn-sidebar-toggle">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-brand">
          <div class="brand-icon">N</div>
          <span class="brand-text">涅槃 CRM</span>
          <span class="brand-sub">企业服务管理平台</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-search">
          <svg class="search-icon" viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="global-search" placeholder="搜索客户、商机...">
        </div>
        <button class="topbar-icon-btn" title="电话">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="topbar-icon-btn" title="通知" id="btn-notification">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="icon-badge"></span>
        </button>
        <div class="topbar-user" id="topbar-user">
          <div class="user-avatar">李</div>
          <span class="user-name">李春洁</span>
          <svg class="user-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </header>

    <!-- 主体区域：侧边栏 + 内容 -->
    <div class="main-area">
      <!-- 侧边栏 - 浅灰白底 -->
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
          <div class="sidebar-section">
            <div class="sidebar-section-title">工作台</div>
            <div class="nav-item active" data-route="#/dashboard">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
              <span>我的工作台</span>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-section-title">销售管理</div>
            <div class="nav-item" data-route="#/leads">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
              <span>线索管理</span>
            </div>
            <div class="nav-item" data-route="#/lead-pool">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M2 20h20"/><path d="M5 20V10l7-7 7 7v10"/><path d="M9 20v-6h6v6"/></svg></span>
              <span>线索公海</span>
            </div>
            <div class="nav-item" data-route="#/customers">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
              <span>客户管理</span>
            </div>
            <div class="nav-item" data-route="#/customer-pool">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M2 20h20"/><path d="M5 20V10l7-7 7 7v10"/><path d="M9 20v-6h6v6"/></svg></span>
              <span>客户公海</span>
            </div>
            <div class="nav-item" data-route="#/opportunities">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
              <span>企服商机</span>
            </div>
            <div class="nav-item" data-route="#/orders">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
              <span>订单管理</span>
            </div>
            <div class="nav-item" data-route="#/contracts">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="13" x2="8" y2="13"/><line x1="12" y1="17" x2="8" y2="17"/><line x1="16" y1="9" x2="8" y2="9"/></svg></span>
              <span>合同管理</span>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-section-title">协同办公</div>
            <div class="nav-item" data-route="#/approvals">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
              <span>审批管理</span>
            </div>
            <div class="nav-item" data-route="#/field-visits">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
              <span>外勤记录</span>
            </div>
            <div class="nav-item" data-route="#/pre-sales">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
              <span>售前项目</span>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-section-title">协作管理</div>
            <div class="nav-item" data-route="#/contacts">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <span>联系人</span>
            </div>
            <div class="nav-item" data-route="#/followups">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
              <span>跟进记录</span>
            </div>
            <div class="nav-item" data-route="#/products">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>
              <span>产品管理</span>
            </div>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="nav-group expanded">
            <div class="nav-item nav-group-toggle">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
              <span>系统设置</span>
              <span class="nav-group-arrow"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
            </div>
            <div class="nav-sub-items">
              <div class="nav-sub-item" data-route="#/settings">
                <span class="nav-icon"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                <span>系统设置</span>
              </div>
              <div class="nav-sub-item" data-route="#/rules">
                <span class="nav-icon"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></span>
                <span>资源流转规则</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 移动端遮罩 -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- 内容区 -->
      <div class="content-wrapper">
        <div class="content-area" id="app-content">
          <!-- 内容由路由动态渲染 -->
          <div style="display:flex;align-items:center;justify-content:center;height:100%">
            <div class="spinner" style="width:32px;height:32px;border-width:3px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS 加载顺序 -->
  <script src="js/events.js?v=2"></script>
  <script src="js/utils/helpers.js?v=2"></script>
  <script src="js/store.js?v=4"></script>
  <script src="js/router.js?v=2"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/components.js?v=5"></script>
  <script src="js/modules/dashboard.js?v=2"></script>
  <script src="js/modules/products.js?v=3"></script>
  <script src="js/modules/leads.js?v=4"></script>
  <script src="js/modules/customers.js?v=44"></script>
  <script src="js/modules/contacts.js?v=3"></script>
  <script src="js/modules/opportunities.js?v=26"></script>
  <script src="js/modules/leadPool.js?v=2"></script>
  <script src="js/modules/customerPool.js?v=4"></script>
  <script src="js/modules/orders.js?v=9"></script>
  <script src="js/modules/contracts.js?v=6"></script>
  <script src="js/modules/rules.js?v=2"></script>
  <script src="js/modules/followups.js?v=2"></script>
  <script src="js/modules/approvals.js?v=10"></script>
  <script src="js/modules/fieldVisits.js?v=1"></script>
  <script src="js/modules/preSales.js?v=36"></script>
  <script src="js/utils/seed.js?v=26"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
